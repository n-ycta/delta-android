[package]
name = "delta-android"
version = "0.1.12"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "delta_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = {version="2",features= [] }

[dependencies]
tauri = {version="2",features= [] }
delta-native-host = {git="https://github.com/n-ycta/delta-ui",rev="6f9fa645b145bf09ce602372cfd53e58b20b1313"}

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
