[package]
name = "delta-android"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "delta_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = {version="2",features=[]}

[dependencies]
tauri = {version="2",features=[]}
delta-native-host = {git="https://github.com/n-ycta/delta-ui",rev="52b034e94c3de66b310cbe242e790204c2f73e01"}

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
