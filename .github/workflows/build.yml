name: Build embedded Android preview
on:
  push:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: |
          sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
      - run: npm ci --ignore-scripts
      - run: npm run build:ui
      - run: npx tauri android init --ci
      - run: npx tauri android build --debug --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: delta-android-arm64-debug-preview
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
