name: Native Android
on:
  push:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      acceptance_run:
        description: Existing signed-APK workflow run to test without rebuilding
        required: false
        type: string
permissions:
  contents: read
jobs:
  android:
    if: inputs.acceptance_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: 'src-tauri -> target', cache-on-failure: true}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: 'aarch64-linux-android,x86_64-linux-android'}
      - run: |
          sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
      - run: npm ci --ignore-scripts
      - run: python tests/icon-resources.py
      - run: npx tauri android init --ci
      - run: python3 scripts/prepare-android.py
      - name: Restore private signing key
        env:
          KEY: ${{ secrets.DELTA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/delta-release.p12"
          chmod 600 "$RUNNER_TEMP/delta-release.p12"
          echo "DELTA_KEYSTORE=$RUNNER_TEMP/delta-release.p12" >> $GITHUB_ENV
      - name: Build signed universal APK
        env:
          DELTA_STORE_PASSWORD: ${{ secrets.DELTA_STORE_PASSWORD }}
          DELTA_KEY_PASSWORD: ${{ secrets.DELTA_KEY_PASSWORD }}
        run: npx tauri android build --apk --target aarch64 x86_64 --ci
      - name: Verify APK signature
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: delta-android-signed
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
      - if: always()
        run: rm -f "$RUNNER_TEMP/delta-release.p12"
  emulator:
    if: always() && (needs.android.result == 'success' || inputs.acceptance_run != '')
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: actions/download-artifact@v4
        with:
          name: delta-android-signed
          path: apk
          run-id: ${{ inputs.acceptance_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare Mesa headless display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-dri libegl1 xvfb
          Xvfb :99 -screen 0 1280x800x24 > /tmp/delta-xvfb.log 2>&1 &
          echo DISPLAY=:99 >> "$GITHUB_ENV"
          echo LIBGL_ALWAYS_SOFTWARE=1 >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 13025442 # Official stable 35.4.9 for API 35; pin the pre-SwANGLE CI renderer.
          arch: x86_64
          target: google_apis
          disable-animations: true
          ram-size: 4096M
          cores: 2
          emulator-options: -no-window -gpu host -feature -Vulkan -noaudio -no-boot-anim -no-snapshot-save -no-snapshot-load
          script: |
            mkdir -p acceptance
            adb logcat > acceptance/logcat-stream.txt 2>&1 &
            adb shell svc wifi disable
            adb shell svc data disable
            sleep 15
            adb install --no-streaming $(find apk -name '*.apk' | head -1)
            python3 tests/emulator-smoke.py
      - name: Runner diagnostics
        if: always()
        run: |
          mkdir -p acceptance
          free -m > acceptance/runner-memory.txt
          sudo dmesg | tail -100 > acceptance/runner-kernel.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: android-acceptance, path: acceptance}
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, emulator]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: delta-android-signed
          path: artifacts
      - run: |
          mkdir release
          cp "$(find artifacts -name '*.apk' | head -1)" release/Delta-Android-arm64-x86_64.apk
          cd release && sha256sum *.apk > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Delta Android ${GITHUB_REF_NAME#v}" --notes-file RELEASE.md
          gh release upload "$GITHUB_REF_NAME" release/*
